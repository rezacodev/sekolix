name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  qah:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:quiet
      - run: npm run typecheck
      - run: npx prisma validate
      - run: npm run test:qah
